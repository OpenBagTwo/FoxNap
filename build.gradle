plugins {
    id "net.fabricmc.fabric-loom" version '1.15-SNAPSHOT'
    id "fr.brouillard.oss.gradle.jgitver" version "0.9.1"
    id 'com.gradleup.shadow' version '9.3.1'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/releases' }
}

loom {
    accessWidenerPath = file("src/main/resources/foxnap.accesswidener")
}

dependencies {

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:$project.loader_version"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ModMenu support
    implementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    //SnakeYAML
    compileOnly "org.yaml:snakeyaml:${project.snakeyaml_version}"
    shadow(implementation("org.yaml:snakeyaml:${project.snakeyaml_version}"))

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 26.1 upwards uses Java 21.
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier.set("dev")
    relocate "org.yaml", "${project.maven_group}.shadow.org.yaml"
}

jgitver {
    useDirty = true
    useGitCommitID = true
    gitCommitIDLength = 8
}